name: Sync Upstream All Releases & Assets

on:
  schedule:
    - cron: '0 2 * * *' # 每天凌晨 2 点自动运行一次（可按需修改）
  workflow_dispatch: # 允许在 GitHub Actions 页面手动点击触发

jobs:
  sync-releases:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予写入权限以便推送、删除 Tags、创建和管理 Releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 必须为 0，才能完整获取所有历史 Tags

      - name: Setup Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Sync Tags and Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: "FongMi/Release" # ⚠️ 请修改为上游原仓库，例如: "octocat/Spoon-Knife"
        run: |
          python3 - << 'EOF'
          import os
          import subprocess
          import json
          import glob
          import shutil

          upstream = os.environ["UPSTREAM_REPO"]
          target = os.environ["GITHUB_REPOSITORY"]

          print(f"开始双向镜像同步上游 [{upstream}] 的 Tags 和 Releases 到 [{target}]...")

          # --- 第一部分：双向同步 Git Tags (增加与删除) ---
          print("正在同步 Git Tags...")
          subprocess.run(["git", "remote", "add", "upstream", f"https://github.com/{upstream}.git"], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          subprocess.run(["git", "fetch", "upstream", "--tags", "--force"], check=True)

          # 获取上游的所有 Tags
          res_up = subprocess.run(["git", "ls-remote", "--tags", "upstream"], stdout=subprocess.PIPE, text=True, check=True)
          upstream_tags = set()
          for line in res_up.stdout.splitlines():
              parts = line.split("\t")
              if len(parts) == 2:
                  ref = parts[1]
                  if ref.startswith("refs/tags/") and not ref.endswith("^{}"):
                      tag_name = ref.replace("refs/tags/", "")
                      upstream_tags.add(tag_name)

          # 获取你本地 (origin) 的所有 Tags
          res_loc = subprocess.run(["git", "ls-remote", "--tags", "origin"], stdout=subprocess.PIPE, text=True, check=True)
          local_tags = set()
          for line in res_loc.stdout.splitlines():
              parts = line.split("\t")
              if len(parts) == 2:
                  ref = parts[1]
                  if ref.startswith("refs/tags/") and not ref.endswith("^{}"):
                      tag_name = ref.replace("refs/tags/", "")
                      local_tags.add(tag_name)

          # 1. 删除本地有但上游已经删掉的 Tags
          for tag in local_tags:
              if tag not in upstream_tags:
                  print(f"==> 发现上游已删除 Tag: [{tag}]，正在从你的 Fork 仓库中删除...")
                  subprocess.run(["git", "tag", "-d", tag], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  subprocess.run(["git", "push", "origin", f":refs/tags/{tag}"], stdout=subprocess.PIPE, stderr=subprocess.PIPE)

          # 2. 推送所有新增/更新的 Tags 到你的仓库
          subprocess.run(["git", "push", "origin", "--tags", "--force"], check=True)
          print("Tags 双向同步完成！")


          # --- 第二部分：同步 Releases 页面与二进制附件 ---
          print("正在同步 Releases 页面与附件...")
          cmd = ["gh", "api", f"repos/{upstream}/releases", "--paginate"]
          result = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
          if result.returncode != 0:
              print(f"获取上游 Releases 失败: {result.stderr}")
              exit(1)

          upstream_releases = json.loads(result.stdout)
          upstream_rel_tags = {rel["tag_name"] for rel in upstream_releases}

          local_cmd = ["gh", "api", f"repos/{target}/releases", "--paginate"]
          local_result = subprocess.run(local_cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
          if local_result.returncode != 0:
              print(f"获取本地 Releases 失败: {local_result.stderr}")
              exit(1)

          local_releases = json.loads(local_result.stdout)
          local_tags_map = {rel["tag_name"]: rel for rel in local_releases}

          # 1. 清理本地 Release list 中多余的 Release 页面
          for local_tag, local_rel in local_tags_map.items():
              if local_tag not in upstream_rel_tags:
                  print(f"==> 发现上游 Release list 已移除: [{local_tag}]，正在清理本地 Release 页面...")
                  subprocess.run(["gh", "release", "delete", local_tag, "-R", target, "--yes"], stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)

          # 2. 同步/更新上游现有的 Releases（利用 make_latest 精准控制 Latest 标签位置）
          releases_to_process = list(reversed(upstream_releases))

          for rel in releases_to_process:
              tag = rel["tag_name"]
              title = rel["name"] or tag
              body = rel["body"] or ""
              draft = rel["draft"]
              prerelease = rel.get("prerelease", False)
              published_at = rel.get("published_at")
              
              is_latest = (rel["tag_name"] == upstream_releases[0]["tag_name"])
              make_latest_val = "true" if is_latest else "false"

              upstream_assets = rel.get("assets", [])
              upstream_asset_names = {u["name"] for u in upstream_assets}

              if tag not in local_tags_map:
                  print(f"==> 发现新 Release，正在创建: {tag} (设为 Latest: {is_latest})")
                  payload = json.dumps({
                      "tag_name": tag,
                      "name": title,
                      "body": body,
                      "draft": draft,
                      "prerelease": prerelease,
                      "published_at": published_at,
                      "make_latest": make_latest_val
                  })
                  create_res = subprocess.run(["gh", "api", f"repos/{target}/releases", "--input", "-"], input=payload, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
                  if create_res.returncode != 0:
                      print(f"创建 Release {tag} 失败: {create_res.stderr}")
                      continue

                  if upstream_assets:
                      shutil.rmtree("./temp_assets", ignore_errors=True)
                      os.makedirs("./temp_assets", exist_ok=True)
                      print(f"└── 正在下载 {tag} 的二进制附件...")
                      dl_res = subprocess.run(["gh", "release", "download", tag, "-D", "./temp_assets", "-R", upstream, "--clobber"], stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
                      if dl_res.returncode == 0:
                          files = glob.glob("./temp_assets/*")
                          if files:
                              print(f"└── 正在将附件上传到你的 Fork 仓库...")
                              subprocess.run(["gh", "release", "upload", tag] + files + ["-R", target, "--clobber"], stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
                      shutil.rmtree("./temp_assets", ignore_errors=True)
              else:
                  local_rel_data = local_tags_map[tag]
                  local_rel_id = local_rel_data["id"]
                  local_assets = {asset["name"]: asset for asset in local_rel_data.get("assets", [])}
                  
                  print(f"==> 正在同步更新 Release 元数据: {tag} (make_latest: {make_latest_val})")
                  patch_payload = json.dumps({
                      "name": title,
                      "body": body,
                      "draft": draft,
                      "prerelease": prerelease,
                      "published_at": published_at,
                      "make_latest": make_latest_val
                  })
                  subprocess.run(["gh", "api", "-X", "PATCH", f"repos/{target}/releases/{local_rel_id}", "--input", "-"], input=patch_payload, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)

                  need_update = False
                  for u_asset in upstream_assets:
                      name = u_asset["name"]
                      size = u_asset["size"]
                      if name not in local_assets:
                          print(f"==> [{tag}] 本地缺失附件: {name}")
                          need_update = True
                      elif local_assets[name]["size"] != size:
                          print(f"==> [{tag}] 附件大小有变化 ({name})")
                          need_update = True

                  redundant_assets = [l_name for l_name in local_assets if l_name not in upstream_asset_names]
                  if redundant_assets:
                      print(f"==> [{tag}] 发现上游已移除的冗余附件: {redundant_assets}")
                      need_update = True

                  if need_update:
                      for r_name in redundant_assets:
                          asset_id = local_assets[r_name]["id"]
                          print(f"└── 正在删除本地冗余附件: {r_name}")
                          subprocess.run(["gh", "api", "-X", "DELETE", f"repos/{target}/releases/assets/{asset_id}"], stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)

                      shutil.rmtree("./temp_assets", ignore_errors=True)
                      os.makedirs("./temp_assets", exist_ok=True)
                      print(f"└── 正在重新下载并同步 [{tag}] 最新的附件...")
                      dl_res = subprocess.run(["gh", "release", "download", tag, "-D", "./temp_assets", "-R", upstream, "--clobber"], stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
                      if dl_res.returncode == 0:
                          files = glob.glob("./temp_assets/*")
                          if files:
                              print(f"└── 正在使用 --clobber 覆盖上传更新后的附件...")
                              subprocess.run(["gh", "release", "upload", tag] + files + ["-R", target, "--clobber"], stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
                      shutil.rmtree("./temp_assets", ignore_errors=True)

          print("Releases 与 Tags 双向完整镜像同步完成！")
          EOF
